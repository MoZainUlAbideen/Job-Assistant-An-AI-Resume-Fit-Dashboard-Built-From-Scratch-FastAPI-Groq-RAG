<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1220;
    --ink-2: #121B2E;
    --ink-3: #1A2540;
    --hairline: #263252;
    --amber: #F0A93B;
    --amber-dim: #8A6220;
    --paper: #E7EBF0;
    --paper-dim: #8B95AC;
    --signal-good: #6FBF9E;
    --signal-bad: #D97D6C;
    --radius: 3px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  ::selection { background: var(--amber); color: var(--ink); }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Header: departure board bar ---------- */
  header.board {
    border-bottom: 1px solid var(--hairline);
    padding: 20px clamp(16px, 4vw, 48px);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .board-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper);
  }
  .board-title span { color: var(--amber); }
  .board-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--paper-dim);
    text-transform: uppercase;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 48px);
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 28px;
  }
  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--ink-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 22px;
  }
  .panel + .panel { margin-top: 20px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 14px 0;
  }

  label.field-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-bottom: 6px;
  }

  input[type="file"], textarea {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
  }
  textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  input[type="file"] { padding: 10px; cursor: pointer; }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: var(--radius);
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    margin-top: 12px;
  }
  button:hover { background: var(--amber); color: var(--ink); }
  button:disabled {
    border-color: var(--hairline);
    color: var(--paper-dim);
    cursor: not-allowed;
    background: transparent;
  }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    margin-top: 10px;
    min-height: 16px;
  }
  .status-line.ok { color: var(--signal-good); }
  .status-line.err { color: var(--signal-bad); }

  .resume-summary { margin-top: 14px; font-size: 13px; color: var(--paper-dim); }
  .resume-summary strong { color: var(--paper); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    color: var(--paper-dim);
  }

  /* ---------- Boarding pass job cards ---------- */
  .board-list h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin: 0 0 14px 0;
    display: flex;
    justify-content: space-between;
  }

  .pass {
    position: relative;
    background: var(--ink-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    display: grid;
    grid-template-columns: 1fr auto;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .pass-main { padding: 18px 20px; }
  .pass-title { font-size: 17px; font-weight: 600; }
  .pass-company { font-size: 13px; color: var(--paper-dim); margin-top: 2px; }

  .pass-stub {
    border-left: 1px dashed var(--hairline);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 120px;
    background: var(--ink-3);
  }
  .flip-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 0.02em;
  }
  .flip-score.flipping { animation: flip 0.5s steps(1); }
  @keyframes flip {
    0% { opacity: 0.2; transform: translateY(-3px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .flip-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-top: 4px;
  }

  .gate-track {
    display: flex;
    align-items: center;
    gap: 0;
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .gate-step {
    padding: 4px 10px 4px 0;
    color: var(--paper-dim);
    position: relative;
  }
  .gate-step::after { content: '→'; margin-left: 10px; color: var(--hairline); }
  .gate-step:last-child::after { content: ''; }
  .gate-step.active { color: var(--amber); }
  .gate-step.done { color: var(--signal-good); }

  select.status-select {
    margin-top: 12px;
    background: var(--ink);
    border: 1px solid var(--hairline);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    border-radius: var(--radius);
    padding: 6px 8px;
  }

  .gap-list, .suggestion-list { margin-top: 12px; }
  .gap-item, .suggestion-item {
    font-size: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--hairline);
  }
  .gap-item .skill { color: var(--signal-bad); font-weight: 600; }
  .suggestion-item .target { color: var(--amber); font-weight: 600; }
  .suggestion-item .rewrite { color: var(--paper); margin-top: 3px; }
  .suggestion-item .original { color: var(--paper-dim); text-decoration: line-through; margin-top: 3px; }

  .details-toggle {
    background: none; border: none; color: var(--paper-dim);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer; padding: 0; margin-top: 14px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .details-toggle:hover { color: var(--amber); }

  .empty-state {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    padding: 30px 0;
    text-align: center;
    border: 1px dashed var(--hairline);
    border-radius: var(--radius);
  }
</style>
</head>
<body>

<header class="board">
  <div class="board-title">JOB <span>CONTROL</span></div>
  <div class="board-meta" id="clock">--</div>
</header>

<main>
  <div>
    <section class="panel">
      <p class="eyebrow">01 · Load resume</p>
      <label class="field-label" for="resumeFile">Resume file (.pdf or .docx)</label>
      <input type="file" id="resumeFile" accept=".pdf,.docx">
      <button id="uploadBtn">Upload &amp; parse</button>
      <div class="status-line" id="resumeStatus"></div>
      <div class="resume-summary" id="resumeSummary" style="display:none;">
        <div><strong id="resumeYears"></strong> yrs experience (est.)</div>
        <div class="chip-row" id="resumeSkills"></div>
      </div>
    </section>

    <section class="panel">
      <p class="eyebrow">02 · Capture a job</p>
      <label class="field-label" for="jdText">Paste the job description</label>
      <textarea id="jdText" placeholder="Paste the full job posting text here..."></textarea>
      <label class="field-label" style="margin-top:10px;" for="jdUrl">Source URL (optional)</label>
      <input type="text" id="jdUrl" placeholder="https://..." style="width:100%;">
      <button id="captureBtn">Capture &amp; score</button>
      <div class="status-line" id="captureStatus"></div>
    </section>

    <section class="panel" id="latestScanPanel" style="display:none;">
      <p class="eyebrow">Latest scan</p>
      <div id="latestScanTitle" style="font-size:15px; font-weight:600;"></div>
      <div class="flip-score mono" id="latestScanScore" style="font-size:38px; margin-top:8px;"></div>
      <div class="flip-label">Fit score</div>
      <div class="chip-row" id="latestScanMatched"></div>
      <div class="gap-list" id="latestScanGaps"></div>
      <div class="suggestion-list" id="latestScanSuggestions"></div>
    </section>
  </div>

  <div class="board-list">
    <h2><span>Applications</span><span id="appCount" class="mono">0</span></h2>
    <div id="appList"></div>
  </div>
</main>

<script>
const API = window.location.origin;
let resumeId = localStorage.getItem('job_control_resume_id') || null;
let lastFullResults = {}; // application_id -> full match result (gaps/suggestions), kept client-side

function setClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) +
    ' · ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
setClock();
setInterval(setClock, 30000);

function setStatus(el, msg, kind) {
  el.textContent = msg;
  el.className = 'status-line' + (kind ? ' ' + kind : '');
}

// ---------- Resume upload ----------
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('resumeFile');
  const statusEl = document.getElementById('resumeStatus');
  if (!fileInput.files.length) {
    setStatus(statusEl, 'Choose a file first.', 'err');
    return;
  }
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  setStatus(statusEl, 'Uploading and parsing...', '');

  const form = new FormData();
  form.append('file', fileInput.files[0]);

  try {
    const res = await fetch(`${API}/resume/upload`, { method: 'POST', body: form });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || `HTTP ${res.status}`);
    }
    const data = await res.json();
    resumeId = data.resume_id;
    localStorage.setItem('job_control_resume_id', resumeId);
    setStatus(statusEl, `Parsed. Resume ID ${resumeId} ready.`, 'ok');

    const summary = document.getElementById('resumeSummary');
    summary.style.display = 'block';
    document.getElementById('resumeYears').textContent = data.parsed.years_experience_estimate ?? '—';
    const skillsEl = document.getElementById('resumeSkills');
    skillsEl.innerHTML = '';
    (data.parsed.skills || []).forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = s;
      skillsEl.appendChild(chip);
    });
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// ---------- Job capture + score ----------
document.getElementById('captureBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('captureStatus');
  const jdText = document.getElementById('jdText').value.trim();
  const jdUrl = document.getElementById('jdUrl').value.trim();

  if (!resumeId) {
    setStatus(statusEl, 'Upload a resume first.', 'err');
    return;
  }
  if (!jdText) {
    setStatus(statusEl, 'Paste a job description first.', 'err');
    return;
  }

  const btn = document.getElementById('captureBtn');
  btn.disabled = true;
  setStatus(statusEl, 'Capturing job...', '');

  try {
    const captureRes = await fetch(`${API}/jobs/capture`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw_text: jdText, source_url: jdUrl || null })
    });
    if (!captureRes.ok) throw new Error(await captureRes.text());
    const captureData = await captureRes.json();

    setStatus(statusEl, 'Scoring against your resume...', '');
    const scoreRes = await fetch(`${API}/match/score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resume_id: resumeId, job_id: captureData.job_id })
    });
    if (!scoreRes.ok) throw new Error(await scoreRes.text());
    const scoreData = await scoreRes.json();

    setStatus(statusEl, 'Scored. See below.', 'ok');
    renderLatestScan(captureData.parsed, scoreData.result);
    document.getElementById('jdText').value = '';
    document.getElementById('jdUrl').value = '';
    await loadApplications();
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// ---------- Applications list ----------
const GATES = ['captured', 'applied', 'interviewing', 'offer'];
const GATE_LABELS = { captured: 'Scheduled', applied: 'Boarding', interviewing: 'Departed', offer: 'Arrived', rejected: 'Cancelled' };

function renderGateTrack(status) {
  if (status === 'rejected') {
    return `<div class="gate-track"><span class="gate-step" style="color:var(--signal-bad);">Cancelled</span></div>`;
  }
  const idx = GATES.indexOf(status);
  return '<div class="gate-track">' + GATES.map((g, i) => {
    const cls = i < idx ? 'done' : (i === idx ? 'active' : '');
    return `<span class="gate-step ${cls}">${GATE_LABELS[g]}</span>`;
  }).join('') + '</div>';
}

async function loadApplications() {
  const listEl = document.getElementById('appList');
  const countEl = document.getElementById('appCount');
  try {
    const res = await fetch(`${API}/applications`);
    if (!res.ok) throw new Error(await res.text());
    const apps = await res.json();
    countEl.textContent = apps.length;

    if (!apps.length) {
      listEl.innerHTML = `<div class="empty-state">No jobs captured yet. Paste a job description on the left to start tracking.</div>`;
      return;
    }

    listEl.innerHTML = '';
    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'pass';
      const score = app.fit_score != null ? Math.round(app.fit_score) : '--';
      card.innerHTML = `
        <div class="pass-main">
          <div class="pass-title">${escapeHtml(app.job_title || 'Untitled role')}</div>
          <div class="pass-company">${escapeHtml(app.company || 'Company unknown')}</div>
          ${renderGateTrack(app.status)}
          <select class="status-select" data-id="${app.application_id}">
            ${['captured','applied','interviewing','offer','rejected'].map(s =>
              `<option value="${s}" ${s === app.status ? 'selected' : ''}>${GATE_LABELS[s]}</option>`
            ).join('')}
          </select>
        </div>
        <div class="pass-stub">
          <div class="flip-score mono">${score}</div>
          <div class="flip-label">Fit score</div>
        </div>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        await fetch(`${API}/applications/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: e.target.value })
        });
        loadApplications();
      });
    });
  } catch (e) {
    listEl.innerHTML = `<div class="empty-state">Couldn't reach the server. Is uvicorn running?</div>`;
  }
}

// ---------- Latest scan detail ----------
function renderLatestScan(parsedJob, result) {
  const panel = document.getElementById('latestScanPanel');
  panel.style.display = 'block';

  document.getElementById('latestScanTitle').textContent =
    (parsedJob.title || 'Untitled role') + (parsedJob.company ? ' — ' + parsedJob.company : '');
  document.getElementById('latestScanScore').textContent = Math.round(result.fit_score);

  const matchedEl = document.getElementById('latestScanMatched');
  matchedEl.innerHTML = '';
  (result.matched_skills || []).forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.color = 'var(--signal-good)';
    chip.style.borderColor = 'var(--signal-good)';
    chip.textContent = '✓ ' + s;
    matchedEl.appendChild(chip);
  });

  const gapsEl = document.getElementById('latestScanGaps');
  gapsEl.innerHTML = '';
  (result.gaps || []).forEach(g => {
    const div = document.createElement('div');
    div.className = 'gap-item';
    const label = g.severity === 'missing' ? 'Missing' : 'Weak match';
    div.innerHTML = `<span class="skill">${label}:</span> ${escapeHtml(g.skill)}`;
    gapsEl.appendChild(div);
  });

  const suggEl = document.getElementById('latestScanSuggestions');
  suggEl.innerHTML = '';
  if (result.suggestions && result.suggestions.length) {
    const heading = document.createElement('div');
    heading.className = 'eyebrow';
    heading.style.marginTop = '16px';
    heading.textContent = 'Suggested rewrites';
    suggEl.appendChild(heading);
    result.suggestions.forEach(s => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerHTML = `
        <div class="target">Targets: ${escapeHtml(s.target_skill)}</div>
        <div class="original">${escapeHtml(s.original_bullet)}</div>
        <div class="rewrite">${escapeHtml(s.suggested_rewrite)}</div>
      `;
      suggEl.appendChild(div);
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// Restore resume summary badge if we already have an id from a previous session
if (resumeId) {
  document.getElementById('resumeStatus').textContent = `Using saved resume ID ${resumeId}.`;
}

loadApplications();
</script>
</body>
</html>
